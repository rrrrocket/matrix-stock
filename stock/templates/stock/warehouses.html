{% extends 'stock/base.html' %}
{% block content %}
<div class="page-heading"><h1>仓库设置</h1></div>
<div class="section-grid narrow-right">
  <section class="card panel"><div class="panel-head"><h2>仓库列表</h2></div><div class="table-wrap"><table><thead><tr><th>编码</th><th>仓库</th><th>创建时间</th><th>操作</th></tr></thead><tbody>{% for warehouse in warehouses %}<tr><td><code>{{ warehouse.code }}</code></td><td><b>{{ warehouse.name }}</b></td><td>{{ warehouse.created_at|date:'Y-m-d' }}</td><td><form method="post" action="{% url 'delete_warehouse' warehouse.id %}" data-confirm="确认删除仓库 {{ warehouse.name }}？">{% csrf_token %}<button class="text-button danger-text" type="submit">删除</button></form></td></tr>{% empty %}<tr><td colspan="4" class="empty-cell">暂无仓库</td></tr>{% endfor %}</tbody></table></div></section>
  <section class="card panel"><div class="panel-head"><h2>新增仓库</h2></div><form method="post" class="form-stack">{% csrf_token %}<label>仓库编码<input name="code" maxlength="40" required></label><label>仓库名称<input name="name" maxlength="100" required></label><button class="button primary" type="submit">创建仓库</button></form></section>
</div>
{% endblock %}
